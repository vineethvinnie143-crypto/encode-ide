name: Sandbox

# The Windows half of the operating-system sandbox is a helper built from C# on the machine and a set of Windows
# security settings. Only a real Windows shows whether Git Bash, PowerShell and node still work under it, so the
# package's tests run here on their own (a few minutes) whenever it changes, besides in CI.yml with everything else.
on:
  pull_request:
    paths:
      - 'packages/sandbox/**'
      - 'scripts/test.mjs'
      - '.github/workflows/sandbox.yml'
  workflow_dispatch:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # On eNCode's own Windows runner; see ci.yml.
  windows:
    name: Windows sandbox
    runs-on: ${{ fromJSON(vars.ENCODE_WINDOWS_RUNNER || '["self-hosted","windows","encode"]') }}
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      # Third-party code is pinned to full commit hashes; the comments name the releases.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sandbox tests
        env:
          ENCODE_TEST_DIGEST: ${{ runner.temp }}/digest.txt
          ENCODE_SANDBOX_EXPLORE: '1'
        run: node scripts/test.mjs packages/sandbox

      - name: What failed
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP/digest.txt") { Get-Content "$env:RUNNER_TEMP/digest.txt" }

      # eNCode's runner is kept from one job to the next: nothing this job started may stay open and hold files the
      # next checkout deletes (an eNCode, an Electron or a helper left by a failed step).
      - name: Stop what the job left open
        if: always()
        shell: powershell
        run: if (Test-Path scripts/ci/tidy-runner.ps1) { ./scripts/ci/tidy-runner.ps1 }
