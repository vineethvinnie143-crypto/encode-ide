name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The smoke must not depend on a third-party service being up.
      ENCODE_SMOKE_OFFLINE: '1'
    steps:
      # Third-party code is pinned to full commit hashes; the comments name the releases.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sources for hidden characters
        run: node scripts/check-sources.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The editor view is checked in the browser Windows already has.
      - name: Editor browser tests
        run: pnpm test:browser
        env:
          ENCODE_SHOTS: ${{ github.workspace }}/packages/editor-view/screenshots

      # The gateway's Worker in workerd against fake OpenRouter and GitHub servers; needs no account.
      - name: Gateway on the Workers runtime
        run: pnpm --filter @encode/gateway test:workers

      - name: Build
        run: pnpm build

      - name: Download Electron
        run: pnpm --filter @encode/desktop exec install-electron

      - name: End-to-end smoke
        run: pnpm e2e

      # Every run, so a UI change can be reviewed by eye in both themes.
      - name: Keep screenshots and the Electron log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.run_attempt }}
          path: |
            apps/desktop/screenshots
            packages/editor-view/screenshots
          if-no-files-found: ignore
          retention-days: 7
