name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository. The artifact storage job below is the one exception: it may
# delete old artifacts of this repository's runs, and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job runs on eNCode's own Windows runner, a virtual machine on Vineeth's PC set up by
# scripts/ci/windows-runner.ps1 (docs/ci/windows-runner.md): the account's included Actions minutes ran out on
# 2026-10-23. The repository variable ENCODE_WINDOWS_RUNNER, as JSON, sends them elsewhere: "windows-latest" puts
# them back on GitHub's runners.
jobs:
  # A private repository's artifact storage is small (500 MB on a free account), and every run adds screenshots,
  # while a build is about 200 MB. This keeps the newest build and a day of screenshots, so a run is never refused
  # for space. It never fails the run.
  storage:
    name: Artifact storage
    runs-on: ${{ fromJSON(vars.ENCODE_WINDOWS_RUNNER || '["self-hosted","windows","encode"]') }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      # Windows PowerShell, which every Windows has; the runner needs nothing else for this.
      - name: Delete old artifacts, keeping the newest build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "$env:GITHUB_API_URL/repos/$env:REPO/actions/artifacts"
          $all = @()
          for ($page = 1; $page -le 50; $page++) {
            $batch = @((Invoke-RestMethod -Uri "$($api)?per_page=100&page=$page" -Headers $headers).artifacts)
            $all += $batch
            if ($batch.Count -lt 100) { break }
          }
          $live = @($all | Where-Object { -not $_.expired })
          $cutoff = [DateTimeOffset]::UtcNow.AddHours(-24)
          $newest = $live | Where-Object { $_.name -like 'eNCode-windows-*' } | Sort-Object { [DateTimeOffset]$_.created_at } -Descending | Select-Object -First 1
          foreach ($artifact in $live) {
            if ($artifact.name -like 'eNCode-windows-*') {
              if ($newest -and $artifact.id -eq $newest.id) { continue }
            } elseif ([DateTimeOffset]$artifact.created_at -gt $cutoff) {
              continue
            }
            Invoke-RestMethod -Method Delete -Uri "$api/$($artifact.id)" -Headers $headers | Out-Null
            "deleted $($artifact.name) ($($artifact.created_at))"
          }

  windows:
    name: Windows
    runs-on: ${{ fromJSON(vars.ENCODE_WINDOWS_RUNNER || '["self-hosted","windows","encode"]') }}
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The smoke must not depend on a third-party service being up.
      ENCODE_SMOKE_OFFLINE: '1'
      # What the program says about itself in About and in a diagnostics report. A pull request builds a merge
      # commit; the commit that matters is its head.
      ENCODE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      ENCODE_CHANNEL: tester
    steps:
      # Third-party code is pinned to full commit hashes; the comments name the releases.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # On eNCode's runner: its desktop must be on screen, and eNCode's data from an earlier job goes, as on a new
      # machine.
      - name: Tidy eNCode's runner
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: ./scripts/ci/tidy-runner.ps1 -Start

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sources for hidden characters
        run: node scripts/check-sources.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        env:
          ENCODE_TEST_DIGEST: ${{ runner.temp }}/digest.txt
        run: pnpm test

      # Only what failed, a few lines each, so the end of a long log says what went wrong.
      - name: What failed
        if: failure()
        run: if (Test-Path "$env:RUNNER_TEMP/digest.txt") { Get-Content "$env:RUNNER_TEMP/digest.txt" }

      # The editor view is checked in the browser Windows already has.
      - name: Editor browser tests
        run: pnpm test:browser
        env:
          ENCODE_SHOTS: ${{ github.workspace }}/packages/editor-view/screenshots

      # The gateway's Worker in workerd against fake OpenRouter and GitHub servers; needs no account.
      - name: Gateway on the Workers runtime
        run: pnpm --filter @encode/gateway test:workers

      - name: Build
        run: pnpm build

      - name: Download Electron
        run: pnpm --filter @encode/desktop exec install-electron

      - name: End-to-end smoke
        run: pnpm e2e

      # The programs testers are given, unsigned: an installer and a portable program. Each is started the
      # way a tester starts it, so a broken package fails here and not on someone's computer.
      - name: Package
        run: pnpm --filter @encode/desktop package

      - name: Packaged program starts
        working-directory: apps/desktop
        run: node scripts/packaged-smoke.mjs release/win-unpacked/eNCode.exe

      - name: Portable program starts
        working-directory: apps/desktop
        run: node scripts/packaged-smoke.mjs (Get-ChildItem release/*-portable.exe).FullName

      - name: Installer installs, starts and uninstalls
        working-directory: apps/desktop
        run: node scripts/installer-smoke.mjs

      - name: Name the build
        id: build
        run: |
          $short = $env:ENCODE_COMMIT.Substring(0, 7)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=eNCode-windows-$short-run${{ github.run_number }}"

      # A build is handed out from a run started by hand (Actions, CI, Run workflow). Pushes to main do not keep
      # theirs: two builds of about 200 MB fill a private repository's artifact storage.
      - name: Keep the programs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/*-portable.exe
            TESTING.md
          if-no-files-found: error
          retention-days: 14

      # eNCode's runner is kept from one job to the next: nothing this job started may stay open and hold files the
      # next checkout deletes (an eNCode, an Electron or a helper left by a failed step).
      - name: Stop what the job left open
        if: always()
        shell: powershell
        run: if (Test-Path scripts/ci/tidy-runner.ps1) { ./scripts/ci/tidy-runner.ps1 }

      # Every run, so a UI change can be reviewed by eye in both themes. Full storage loses the pictures, not the run.
      - name: Keep screenshots and the Electron log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.run_attempt }}
          path: |
            apps/desktop/screenshots
            packages/editor-view/screenshots
          if-no-files-found: ignore
          retention-days: 3
