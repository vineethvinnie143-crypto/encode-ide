name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository. The artifact storage job below is the one exception: it may
# delete old artifacts of this repository's runs, and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A private repository's artifact storage is small (500 MB on a free account), and every run adds screenshots,
  # while a build is about 200 MB. This keeps the newest build and a day of screenshots, so a run is never refused
  # for space. It never fails the run.
  storage:
    name: Artifact storage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts, keeping the newest build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/artifacts.tsv"
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | [.id, .name, .created_at] | @tsv' > "$list"
          newest=$(awk -F'\t' '$2 ~ /^eNCode-windows-/ && $3 > best { best = $3; id = $1 } END { print id }' "$list")
          while IFS=$'\t' read -r id name created; do
            if [[ $name == eNCode-windows-* ]]; then
              [[ $id == "$newest" ]] && continue
            elif [[ $created > $cutoff ]]; then
              continue
            fi
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" > /dev/null
            echo "deleted $name ($created)"
          done < "$list"

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The smoke must not depend on a third-party service being up.
      ENCODE_SMOKE_OFFLINE: '1'
      # What the program says about itself in About and in a diagnostics report. A pull request builds a merge
      # commit; the commit that matters is its head.
      ENCODE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      ENCODE_CHANNEL: tester
    steps:
      # Third-party code is pinned to full commit hashes; the comments name the releases.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sources for hidden characters
        run: node scripts/check-sources.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        env:
          ENCODE_TEST_DIGEST: ${{ runner.temp }}/digest.txt
        run: pnpm test

      # Only what failed, a few lines each, so the end of a long log says what went wrong.
      - name: What failed
        if: failure()
        run: if (Test-Path "$env:RUNNER_TEMP/digest.txt") { Get-Content "$env:RUNNER_TEMP/digest.txt" }

      # The editor view is checked in the browser Windows already has.
      - name: Editor browser tests
        run: pnpm test:browser
        env:
          ENCODE_SHOTS: ${{ github.workspace }}/packages/editor-view/screenshots

      # The gateway's Worker in workerd against fake OpenRouter and GitHub servers; needs no account.
      - name: Gateway on the Workers runtime
        run: pnpm --filter @encode/gateway test:workers

      - name: Build
        run: pnpm build

      - name: Download Electron
        run: pnpm --filter @encode/desktop exec install-electron

      - name: End-to-end smoke
        run: pnpm e2e

      # The programs testers are given, unsigned: an installer and a portable program. Each is started the
      # way a tester starts it, so a broken package fails here and not on someone's computer.
      - name: Package
        run: pnpm --filter @encode/desktop package

      - name: Packaged program starts
        working-directory: apps/desktop
        run: node scripts/packaged-smoke.mjs release/win-unpacked/eNCode.exe

      - name: Portable program starts
        working-directory: apps/desktop
        run: node scripts/packaged-smoke.mjs (Get-ChildItem release/*-portable.exe).FullName

      - name: Installer installs, starts and uninstalls
        working-directory: apps/desktop
        run: node scripts/installer-smoke.mjs

      - name: Name the build
        id: build
        run: |
          $short = $env:ENCODE_COMMIT.Substring(0, 7)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=eNCode-windows-$short-run${{ github.run_number }}"

      # A build is handed out from a run started by hand (Actions, CI, Run workflow). Pushes to main do not keep
      # theirs: two builds of about 200 MB fill a private repository's artifact storage.
      - name: Keep the programs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/*-portable.exe
            TESTING.md
          if-no-files-found: error
          retention-days: 14

      # Every run, so a UI change can be reviewed by eye in both themes. Full storage loses the pictures, not the run.
      - name: Keep screenshots and the Electron log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.run_attempt }}
          path: |
            apps/desktop/screenshots
            packages/editor-view/screenshots
          if-no-files-found: ignore
          retention-days: 3
