  </defs>
  <rect width="256" height="256" rx="58" fill="url(#tile)" />
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" />
  <path d="M80 180V76L176 180V76" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
