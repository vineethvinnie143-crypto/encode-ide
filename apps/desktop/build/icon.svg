<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>eNCode</title>
  <!-- Trace N: one line drawn between two nodes. Same drawing as src/ui/Logo.tsx; make-icon.py renders the app icon from it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2330" />
      <stop offset="1" stop-color="#0b0c10" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff" />
      <stop offset="1" stop-color="#3fd6ee" />
