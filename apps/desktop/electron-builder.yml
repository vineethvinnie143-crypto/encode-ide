appId: dev.eNCode.ide
productName: eNCode
copyright: MIT
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
# The benchmark's tasks, for Test this model (ADR 0101): small projects the model works on in a temporary folder.
# A task keeps its node_modules as _node_modules, which electron-builder does not leave out.
extraResources:
  - from: ../../packages/bench/tasks
    to: bench-tasks
    filter:
      - '**/*'
# The command line (ADR 0108): bin/encode.cmd runs the app's own program as Node on the CLI bundle in the asar. It is
# in a folder of its own so that putting that folder on PATH never makes `encode` start eNCode.exe instead.
extraFiles:
  - from: build/encode.cmd
    to: bin/encode.cmd
# No native modules are bundled: the shell and terminal are hand-written.
npmRebuild: false
# Unsigned: the builds are for the owner and a few testers (see TESTING.md), and Windows SmartScreen says so.
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
# Installs for the current user, with no administrator prompt.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: eNCode
  uninstallDisplayName: eNCode
  # Sessions and settings are the user's: removing the program leaves them.
  deleteAppDataOnUninstall: false
  artifactName: eNCode-${version}-setup.exe
# One file, nothing installed; it unpacks itself at every start, so it starts slower.
portable:
  artifactName: eNCode-${version}-portable.exe
linux:
  target:
    - AppImage
  executableName: encode
  category: Development
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
publish: null
